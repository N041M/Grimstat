name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A built site is static files with no server to proxy through, and Wahapedia sends no CORS
      # headers, so the browser cannot read it from the deployed app. Its export is copied into the
      # site here instead, where it is same-origin and the Data page's one button reaches it like any
      # other source. Nothing is committed, since the directory is git-ignored and only ever exists in the
      # build. Set the repository variable SKIP_WAHAPEDIA to any value to leave it out.
      - name: Copy the Wahapedia export into the site
        if: ${{ vars.SKIP_WAHAPEDIA == '' }}
        run: pnpm cli mirror --system wh40k-11e --system wh40k-10e --out apps/web/public/wahapedia
      - name: Build web app under the repository sub-path
        run: pnpm --filter @grimstat/web build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
