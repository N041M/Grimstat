name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The root tsconfig covers apps/*/src and packages/*/src. The web app's own also covers its
      # Vite config and its scripts, and nothing else typechecks those.
      - run: pnpm --filter @grimstat/web typecheck
      - run: pnpm test
      # A build that has stopped building should show up on the pull request that broke it, rather
      # than for the first time during a deployment.
      - run: pnpm build
