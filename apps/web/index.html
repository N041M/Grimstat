<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="description" content="Unofficial, local-first Warhammer 40,000 statistics dashboard." />
    <!-- Link previews. Discord, Slack and the rest read these; the image has to be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grimstat" />
    <meta property="og:title" content="Grimstat" />
    <meta property="og:description" content="Unofficial, local-first Warhammer 40,000 statistics dashboard." />
    <meta property="og:url" content="https://grimstat.com/" />
    <meta property="og:image" content="https://grimstat.com/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Grimstat logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Grimstat" />
    <meta name="twitter:description" content="Unofficial, local-first Warhammer 40,000 statistics dashboard." />
    <meta name="twitter:image" content="https://grimstat.com/icon-512.png" />
    <link rel="preload" href="/fonts/IBMPlexSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Grimstat</title>
    <!-- The built page carries a Content-Security-Policy meta tag, written by `cspPlugin` in vite.config.ts. -->
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("grimstat.theme") || "system";
          if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
